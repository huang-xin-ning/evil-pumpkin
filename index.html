      g.fillStyle = 'rgba(75,17,1,.24)';
      g.beginPath();
      g.ellipse(w * x, h * y, w * rx, h * ry, x * .5, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,193,98,.08)';
      g.beginPath();
      g.ellipse(w * x - w * .004, h * y - h * .003, w * rx * .65, h * ry * .6, x * .5, 0, TAU);
      g.fill();
    }

    // warm light spill from face
    const spill = g.createRadialGradient(0, h * .01, w * .01, 0, h * .01, w * .47);
    spill.addColorStop(0, `rgba(255,152,49,${.16 * flicker + glow * .06})`);
    spill.addColorStop(.55, `rgba(255,104,20,${.08 * flicker})`);
    spill.addColorStop(1, 'rgba(255,85,12,0)');
    g.fillStyle = spill;
    g.beginPath();
    g.ellipse(0, h * .01, w * .44, h * .4, 0, 0, TAU);
    g.fill();

    // face cutouts
    const faceGlow = clamp(.68 + glow * .3 + pulse * .16, .5, 1.25);
    const eyeColor = (r = 32) => {
      const gr = g.createRadialGradient(0, 0, 0, 0, 0, r);
      gr.addColorStop(0, '#fff9d9');
      gr.addColorStop(.3, '#ffd479');
      gr.addColorStop(.62, '#ff8a20');
      gr.addColorStop(1, '#541502');
      return gr;
    };
    g.save();
    g.shadowColor = 'rgba(255,115,20,.9)';
    g.shadowBlur = w * .045 * faceGlow;

    // eyes - narrow, downward-angled cuts
    for (const side of [-1, 1]) {
      g.save();
      g.translate(side * w * .195, -h * .115);
      g.scale(side, 1);
      g.rotate(-.055);
      g.beginPath();
      g.moveTo(w * .125, -h * .07);
      g.lineTo(-w * .125, h * .008);
      g.lineTo(-w * .088, h * .06);
      g.lineTo(w * .118, h * .01);
      g.closePath();
      g.fillStyle = eyeColor(w * .135);
      g.fill();
      g.strokeStyle = 'rgba(255,209,129,.42)';
      g.lineWidth = Math.max(1, w * .0022);
      g.stroke();
      g.strokeStyle = 'rgba(43,7,1,.62)';
      g.lineWidth = Math.max(1.4, w * .004);
      g.stroke();
      g.restore();
    }
    g.restore();

    // charred, angry brows
    g.save();
    g.fillStyle = 'rgba(42,8,1,.82)';
    for (const side of [-1, 1]) {
      g.save();
      g.translate(side * w * .195, 0);
      g.scale(side, 1);
      g.beginPath();
      g.moveTo(w * .325, -h * .252);
      g.lineTo(w * .12, -h * .204);
      g.lineTo(-w * .06, -h * .173);
      g.lineTo(-w * .065, -h * .185);
      g.lineTo(w * .12, -h * .221);
      g.lineTo(w * .322, -h * .265);
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(255,128,31,.13)';
      g.lineWidth = Math.max(.8, w * .0015);
      g.stroke();
      g.restore();
    }
    g.restore();

    // pupils, with careful glow
    if (!noPupils) {
      g.save();
      g.shadowColor = 'rgba(8,1,0,.8)';
      g.shadowBlur = 7;
      for (const side of [-1, 1]) {
        g.save();
        g.translate(side * w * .185 + pupilX * w * .016, -h * .105 + pupilY * h * .011);
        g.rotate(side * -.055);
        g.fillStyle = '#100200';
        g.beginPath();
        g.ellipse(0, 0, w * .0105, h * .046, 0, 0, TAU);
        g.fill();
        g.fillStyle = 'rgba(255,241,194,.5)';
        g.beginPath();
        g.ellipse(-w * .0024, -h * .015, w * .0028, h * .010, 0, 0, TAU);
        g.fill();
        g.restore();
      }
      g.restore();
    }

    // nose
    g.save();
    g.shadowColor = 'rgba(255,116,19,.7)';
    g.shadowBlur = w * .025 * faceGlow;
    g.beginPath();
    g.moveTo(-w * .038, -h * .035);
    g.lineTo(w * .038, -h * .035);
    g.lineTo(w * .008, h * .045);
    g.quadraticCurveTo(0, h * .055, -w * .014, h * .041);
    g.closePath();
    g.fillStyle = eyeColor(w * .07);
    g.fill();
    g.restore();

    // mouth
    const mo = open;
    g.save();
    g.shadowColor = 'rgba(255,102,13,.88)';
    g.shadowBlur = w * .04 * faceGlow;
    g.beginPath();
    g.moveTo(-w * .29, h * .105);
    g.lineTo(-w * .225, h * .165);
    g.lineTo(-w * .155, h * .105);
    g.lineTo(-w * .07, h * .175);
    g.lineTo(w * .005, h * .115);
    g.lineTo(w * .085, h * .18);
    g.lineTo(w * .17, h * .105);
    g.lineTo(w * .245, h * .165);
    g.lineTo(w * .295, h * .10);
    g.bezierCurveTo(
      w * .265, h * (.245 + mo * .10),
      w * .145, h * (.30 + mo * .16),
      0, h * (.31 + mo * .16)
    );
    g.bezierCurveTo(
      -w * .15, h * (.305 + mo * .155),
      -w * .26, h * (.245 + mo * .105),
      -w * .29, h * .105
    );
    g.closePath();
    const mouthGrad = g.createLinearGradient(0, h * .08, 0, h * (.30 + mo * .2));
    mouthGrad.addColorStop(0, '#ffdc99');
    mouthGrad.addColorStop(.075, '#ff9c31');
    mouthGrad.addColorStop(.18, '#9e2b04');
    mouthGrad.addColorStop(.34, '#2b0701');
    mouthGrad.addColorStop(.68, '#080100');
    mouthGrad.addColorStop(1, '#020000');
    g.fillStyle = mouthGrad;
    g.fill();
    g.strokeStyle = 'rgba(255,176,72,.42)';
    g.lineWidth = Math.max(1.1, w * .0028);
    g.stroke();
    // deep inner throat
    const throatDeep = g.createRadialGradient(0, h * (.25 + mo * .07), 2, 0, h * (.25 + mo * .07), w * .2);
    throatDeep.addColorStop(0, 'rgba(0,0,0,.72)');
    throatDeep.addColorStop(.62, 'rgba(0,0,0,.34)');
    throatDeep.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = throatDeep;
    g.beginPath();
    g.ellipse(0, h * (.25 + mo * .08), w * .19, h * (.104 + mo * .04), 0, 0, TAU);
    g.fill();
    g.restore();

    // fangs: these are rind, not holes, so they read against the dark mouth
    g.save();
    const toothGrad = g.createLinearGradient(0, h * .12, 0, h * .3);
    toothGrad.addColorStop(0, '#ffc267');
    toothGrad.addColorStop(.35, '#d95610');
    toothGrad.addColorStop(1, '#7e1b03');
    g.fillStyle = toothGrad;
    const toothTop = [
      [-.21, .145, -.145, .145, -.178, .225],
      [-.04, .16, .02, .145, -.008, .245],
      [.13, .16, .195, .14, .162, .23]
    ];
    for (const t of toothTop) {
      g.beginPath();
      g.moveTo(w * t[0], h * t[1]);
      g.lineTo(w * t[2], h * t[3]);
      g.lineTo(w * t[4], h * (t[5] + mo * .03));
      g.closePath();
      g.fill();
      g.strokeStyle = 'rgba(255,174,72,.25)';
      g.lineWidth = Math.max(.8, w * .0015);
      g.stroke();
    }
    g.beginPath();
    g.moveTo(-w * .145, h * (.27 + mo * .14));
    g.lineTo(-w * .085, h * (.258 + mo * .14));
    g.lineTo(-w * .116, h * (.19 + mo * .02));
    g.closePath();
    g.fill();
    g.beginPath();
    g.moveTo(w * .09, h * (.272 + mo * .14));
    g.lineTo(w * .148, h * (.255 + mo * .14));
    g.lineTo(w * .118, h * (.195 + mo * .02));
    g.closePath();
    g.fill();
    g.restore();

    // throat flicker
    if (mo > .1) {
      const throat = g.createRadialGradient(0, h * (.25 + mo * .06), 2, 0, h * (.25 + mo * .06), w * .13);
      throat.addColorStop(0, `rgba(255,104,18,${.24 * mo})`);
      throat.addColorStop(.5, 'rgba(91,20,3,.18)');
      throat.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = throat;
      g.beginPath();
      g.ellipse(0, h * (.26 + mo * .06), w * .12, h * .1, 0, 0, TAU);
      g.fill();
    }

    // cracks
    g.strokeStyle = 'rgba(75,16,2,.55)';
    g.lineWidth = Math.max(1, w * .0022);
    g.lineCap = 'round';
    for (const c of cracks) {
      g.beginPath();
      g.moveTo(w * c[0], h * c[1]);
      g.quadraticCurveTo(w * c[2], h * c[3], w * c[4], h * c[5]);
      g.stroke();
    }

    // small embers at the mouth corners
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const [ex, ey, er] of [[-.28, .14, .005], [.27, .12, .004], [-.1, .08, .003], [.1, .26, .0035]]) {
      g.fillStyle = `rgba(255,177,62,${.25 + flicker * .3})`;
      g.beginPath();
      g.arc(w * ex, h * ey, w * er, 0, TAU);
      g.fill();
    }
    g.restore();

    g.restore();
  }

  function buildBigSprite() {
    const w = state.mainW;
    const h = state.mainH;
    if (!w || !h) return;
    const pad = 1.9;
    const res = Math.min(2, Math.max(1.35, DPR * 1.35));
    const c = document.createElement('canvas');
    c.width = Math.round(w * pad * res);
    c.height = Math.round(h * pad * res);
    const g = c.getContext('2d');
    g.scale(res, res);
    drawBigPumpkin(g, w * pad / 2, h * pad / 2, w, h, {
      sx: 1, sy: 1, rot: 0,
      glow: 1,
      open: .18,
      pupilX: 0, pupilY: 0,
      flicker: 1,
      noAura: true,
      noPupils: true
    });
    bigSprite = { canvas: c, w: w * pad, h: h * pad };
  }

  function drawBigAura(g, cx, cy, w, h, glow) {
    const pulse = clamp(glow, 0, 1.4);
    const aura = g.createRadialGradient(cx, cy, w * .12, cx, cy, w * .9);
    aura.addColorStop(0, `rgba(255,133,35,${.16 + pulse * .10})`);
    aura.addColorStop(.44, `rgba(214,63,13,${.09 + pulse * .05})`);
    aura.addColorStop(1, 'rgba(90,12,3,0)');
    g.fillStyle = aura;
    g.beginPath();
    g.ellipse(cx, cy, w * .86, h * .82, 0, 0, TAU);
    g.fill();
  }

  function drawBigPupils(g, cx, cy, w, h, sx, sy, rot, pupilX, pupilY) {
    g.save();
    g.translate(cx, cy + h * .5);
    g.rotate(rot);
    g.scale(sx, sy);
    g.translate(0, -h * .5);
    g.fillStyle = '#100200';
    for (const side of [-1, 1]) {
      g.save();
      g.translate(side * w * .185 + pupilX * w * .016, -h * .105 + pupilY * h * .011);
      g.rotate(side * -.055);
      g.beginPath();
      g.ellipse(0, 0, w * .0105, h * .046, 0, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,241,194,.5)';
      g.beginPath();
      g.ellipse(-w * .0024, -h * .015, w * .0028, h * .010, 0, 0, TAU);
      g.fill();
      g.fillStyle = '#100200';
      g.restore();
    }
    g.restore();
  }

  function drawMainShadow(g, cx, cy, w, h, jump, groundY) {
    const k = clamp(1 - jump / (h * 1.2), .25, 1);
    const rx = w * .49 * k;
    const ry = h * .065 * k;
    const shadow = g.createRadialGradient(cx, groundY + h * .02, 2, cx, groundY + h * .02, rx);
    shadow.addColorStop(0, `rgba(0,0,0,${.62 * k})`);
    shadow.addColorStop(.55, `rgba(0,0,0,${.32 * k})`);
    shadow.addColorStop(1, 'rgba(0,0,0,0)');
    g.save();
    g.translate(cx, groundY + h * .02);
    g.scale(1, ry / rx);
    g.fillStyle = shadow;
    g.beginPath();
    g.arc(0, 0, rx, 0, TAU);
    g.fill();
    g.restore();

    const warm = g.createRadialGradient(cx, groundY, 2, cx, groundY, rx * .9);
    warm.addColorStop(0, `rgba(255,103,21,${.10 + k * .05})`);
    warm.addColorStop(1, 'rgba(255,80,12,0)');
    g.fillStyle = warm;
    g.beginPath();
    g.ellipse(cx, groundY + h * .01, rx * .9, ry * .55, 0, 0, TAU);
    g.fill();
  }

  /* --- dynamic drawing --- */
  function drawStars(g) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const s of bgState.stars) {
      const a = (.18 + .5 * (0.5 + 0.5 * Math.sin(t * s.speed + s.phase)));
      g.fillStyle = s.hot ? `rgba(255,197,144,${a})` : `rgba(223,220,218,${a})`;
      g.beginPath();
      g.arc(s.x, s.y, s.r, 0, TAU);
      g.fill();
      if (s.hot) {
        g.fillStyle = `rgba(255,142,65,${a * .14})`;
        g.beginPath();
        g.arc(s.x, s.y, s.r * 4, 0, TAU);
        g.fill();
      }
    }
    g.restore();
  }

  function drawBat(g, b) {
    const flap = .55 + Math.sin(t * 6.2 * b.flap + b.phase) * .45;
    g.save();
    g.translate(b.x, b.y);
    g.fillStyle = `rgba(4,2,7,${b.alpha})`;
    g.beginPath();
    g.moveTo(0, 0);
    g.bezierCurveTo(-b.s * .25, -b.s * .35 * flap, -b.s * .65, -b.s * .38 * flap, -b.s * 1.1, -b.s * .05);
    g.quadraticCurveTo(-b.s * .72, b.s * .03, -b.s * .62, b.s * .22);
    g.quadraticCurveTo(-b.s * .4, b.s * .06, -b.s * .24, b.s * .24);
    g.quadraticCurveTo(-b.s * .12, b.s * .1, 0, b.s * .12);
    g.quadraticCurveTo(b.s * .12, b.s * .1, b.s * .24, b.s * .24);
    g.quadraticCurveTo(b.s * .4, b.s * .06, b.s * .62, b.s * .22);
    g.quadraticCurveTo(b.s * .72, b.s * .03, b.s * 1.1, -b.s * .05);
    g.bezierCurveTo(b.s * .65, -b.s * .38 * flap, b.s * .25, -b.s * .35 * flap, 0, 0);
    g.fill();
    g.beginPath();
    g.arc(0, -b.s * .015, b.s * .09, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawEmbers(g, dt) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < embers.length; i++) {
      const e = embers[i];
      e.x += (e.vx + Math.sin(t * e.speed + e.phase) * 7) * dt;
      e.y += e.vy * dt;
      e.alpha -= dt * .012;
      if (e.y < H * .25 || e.alpha <= .02) {
        embers[i] = newEmber(false);
        continue;
      }
      const flick = .65 + .35 * Math.sin(t * 4.4 + e.phase);
      g.fillStyle = e.warm
        ? `rgba(255,143,47,${e.alpha * flick})`
        : `rgba(255,205,157,${e.alpha * flick * .7})`;
      g.beginPath();
      g.arc(e.x, e.y, e.r, 0, TAU);
      g.fill();
      g.fillStyle = e.warm
        ? `rgba(255,96,24,${e.alpha * .13 * flick})`
        : `rgba(255,184,125,${e.alpha * .08 * flick})`;
      g.beginPath();
      g.arc(e.x, e.y, e.r * 4.5, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  function drawParticles(g, dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += p.g * dt;
      p.vx *= Math.pow(p.drag, dt * 60);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      const a = clamp(p.life / p.max, 0, 1);
      g.fillStyle = `rgba(${p.color},${a * .9})`;
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.beginPath();
      g.arc(p.x, p.y, p.r * (0.5 + a * .7), 0, TAU);
      g.fill();
      g.fillStyle = `rgba(${p.color},${a * .1})`;
      g.beginPath();
      g.arc(p.x, p.y, p.r * 5, 0, TAU);
      g.fill();
      g.restore();
    }
  }

  function drawWave(g, dt) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const wv = waves[i];
      wv.r += wv.speed * dt;
      wv.alpha -= dt * .65;
      if (wv.alpha <= 0) { waves.splice(i, 1); continue; }
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.strokeStyle = `rgba(255,139,44,${wv.alpha * .55})`;
      g.lineWidth = wv.width;
      g.beginPath();
      g.arc(wv.x, wv.y, wv.r, 0, TAU);
      g.stroke();
      g.strokeStyle = `rgba(255,208,130,${wv.alpha * .25})`;
      g.lineWidth = 1;
      g.beginPath();
      g.arc(wv.x, wv.y, wv.r * .87, 0, TAU);
      g.stroke();
      g.restore();
    }
  }

  function drawNotes(g, dt) {
    g.save();
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (let i = notes.length - 1; i >= 0; i--) {
      const n = notes[i];
      n.life -= dt;
      if (n.life <= 0) { notes.splice(i, 1); continue; }
      n.x += (n.vx + Math.sin(t * 1.5 + n.phase) * 14) * dt;
      n.y += n.vy * dt;
      n.vy *= Math.pow(.995, dt * 60);
      n.rot += n.vr * dt;
      const a = clamp(n.life / n.max, 0, 1) * .9;
      g.save();
      g.translate(n.x, n.y);
      g.rotate(n.rot);
      g.font = `${n.size}px "Palatino Linotype", Georgia, serif`;
      g.fillStyle = `rgba(255,178,80,${a})`;
      g.shadowColor = 'rgba(255,122,26,.8)';
      g.shadowBlur = 13;
      g.fillText(n.char, 0, 0);
      g.restore();
    }
    g.restore();
  }

  function miniScale(p) {
    const t0 = clamp(p.age / .26, 0, 1);
    const pop = 1 + Math.sin(t0 * Math.PI) * .18;
    return easeOutCubic(t0) * pop * clamp((p.life - p.age) / 2.4, 0, 1);
  }

  function drawMiniShadow(g, p) {
    const ground = p.floor;
    const bot = p.y + p.size * .32;
    if (bot < ground - p.size * .9) return;
    const k = clamp(1 - (ground - bot) / (p.size * .9), 0, 1);
    g.save();
    g.globalAlpha = .25 * k;
    g.fillStyle = '#000';
    g.beginPath();
    g.ellipse(p.x, ground, p.size * .35 * (0.7 + .3 * k), p.size * .065 * k, 0, 0, TAU);
    g.fill();
    g.restore();
  }

  function drawOneMini(g, p) {
    const sc = miniScale(p);
    if (sc <= .001) return;
    const drawSize = p.size * 1.62 * sc;
    g.save();
    g.translate(p.x, p.y);
    g.rotate(p.rot);
    if (p.squash !== 1) g.scale(1 + (p.squash - 1) * .5, 1 - (p.squash - 1) * .5);
    g.scale(p.aspectX || 1, p.aspectY || 1);
    g.globalAlpha = clamp((p.life - p.age) / 2.4, 0, 1);
    g.drawImage(p.sprite, -drawSize / 2, -drawSize / 2, drawSize, drawSize);
    g.restore();
  }

  function drawMinis(g, layer, dt) {
    const arr = minis.filter(p => p.layer === layer);
    if (!arr.length) return;
    arr.sort((a, b) => a.floor - b.floor || a.y - b.y);
    for (const p of arr) drawMiniShadow(g, p);
    for (const p of arr) drawOneMini(g, p);
  }

  function updateMinis(dt) {
    for (let i = minis.length - 1; i >= 0; i--) {
      const p = minis[i];
      p.age += dt;
      p.born = Math.min(1, p.born + dt / .26);
      p.squash += (1 - p.squash) * dt * 12;
      const sc = miniScale(p);
      const half = p.size * .37 * Math.max(.2, sc);

      p.vy += 1520 * dt;
      p.vx *= Math.exp(-.18 * dt);
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.vr *= Math.exp(-.28 * dt);

      // side bounce
      const left = p.size * .38 * Math.max(.2, sc);
      if (p.x < left && p.vx < 0) {
        p.x = left;
        p.vx *= -.52;
        p.vr += rand(-1.5, 1.5);
        p.squash = 1.12;
      } else if (p.x > W - left && p.vx > 0) {
        p.x = W - left;
        p.vx *= -.52;
        p.vr += rand(-1.5, 1.5);
        p.squash = 1.12;
      }

      const bottom = p.y + half;
      if (bottom > p.floor) {
        p.y = p.floor - half;
        if (p.vy > 110) {
          const impact = Math.min(1.4, p.vy / 900);
          p.vy *= -.53;
          p.vx *= .88;
          p.vr *= .72;
          p.squash = 1 + .24 * impact;
          if (impact > .5 && particles.length < 120) {
            for (let k = 0; k < 2; k++) {
              particles.push({
                x: p.x + rand(-6, 6), y: p.floor + rand(-2, 3),
                vx: rand(-70, 70), vy: rand(-80, -10),
                g: 160, r: rand(.6, 1.5), life: rand(.3, .7), max: .7,
                color: '255,139,72', drag: .97
              });
            }
          }
        } else {
          p.vy = 0;
          p.vx *= Math.exp(-5 * dt);
          p.vr *= Math.exp(-5 * dt);
          p.nextHop -= dt;
          if (p.nextHop <= 0) {
            p.vy = -rand(180, 430);
            p.vx += rand(-130, 130);
            p.vr += rand(-2.4, 2.4);
            p.squash = 1.15;
            p.nextHop = rand(1.6, 5.2);
          }
        }
      }

      if (p.age > p.life || p.x < -p.size * 2 || p.x > W + p.size * 2) {
        minis.splice(i, 1);
      }
    }
  }

  function drawCursor(g) {
    if (!state.pointer.active) return;
    const px = state.pointer.x, py = state.pointer.y;
    const pulse = 1 + Math.sin(t * 3.1) * .08;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const gr = g.createRadialGradient(px, py, 1, px, py, 38);
    gr.addColorStop(0, 'rgba(255,158,53,.10)');
    gr.addColorStop(1, 'rgba(255,100,20,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(px, py, 38, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(255,188,108,.47)';
    g.lineWidth = 1;
    g.setLineDash([2, 6]);
    g.lineDashOffset = -t * 16;
    g.beginPath();
    g.arc(px, py, 17 * pulse, 0, TAU);
    g.stroke();
    g.setLineDash([]);
    for (let i = 0; i < 4; i++) {
      const a = t * .8 + i * TAU / 4;
      g.fillStyle = 'rgba(255,168,73,.7)';
      g.beginPath();
      g.arc(px + Math.cos(a) * 23, py + Math.sin(a) * 23, 1.3, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  /* --- main frame --- */
  function frame(now) {
    const dtRaw = (now - lastFrame) / 1000;
    lastFrame = now;
    const dt = clamp(dtRaw, .001, .045);
    t += dt;

    state.flash = Math.max(0, state.flash - dt * 2.5);
    state.shake *= Math.exp(-dt * 11);
    state.excitement *= Math.exp(-dt * 1.15);
    state.musicPulse *= Math.exp(-dt * 3.2);
    state.mouthOpen += ((state.started ? .18 + state.musicPulse * .55 : .06) - state.mouthOpen) * Math.min(1, dt * 8);

    updateMinis(dt);
    for (let i = bats.length - 1; i >= 0; i--) {
      const b = bats[i];
      b.x += (b.speed + Math.sin(t * .4 + b.phase) * 5) * dt;
      b.y += Math.sin(t * .9 + b.phase) * 4 * dt;
      if (b.x > W + 60) {
        b.x = -50;
        b.y = rand(H * .08, H * .38);
      }
    }

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    drawStars(ctx);
    for (const b of bats) drawBat(ctx, b);

    ctx.save();
    const shakeX = (Math.random() - .5) * state.shake;
    const shakeY = (Math.random() - .5) * state.shake * .55;
    ctx.translate(shakeX, shakeY);

    // big pumpkin position
    const bounceDur = 1.58;
    const phase = (t % bounceDur) / bounceDur;
    const liftRaw = Math.abs(Math.sin(phase * Math.PI));
    const lift = Math.pow(liftRaw, .92);
    const jump = lift * (H * .065 + state.excitement * H * .042);
    const impact = Math.max(Math.exp(-phase * 15), Math.exp(-(1 - phase) * 15));
    const sx = 1 + impact * .075 - lift * .012;
    const sy = 1 - impact * .082 + lift * .022;
    const cx = W * .5 + Math.sin(t * .53) * Math.min(18, W * .012);
    const cy = state.groundY - state.mainH * .5 - jump;
    const rot = Math.sin(t * .47) * .013 + clamp((state.pointer.x - W * .5) / W * .03, -.025, .025);
    const flicker = .84 + Math.sin(t * 11.3) * .08 + Math.sin(t * 23.7) * .04;
    const pupilX = clamp((state.pointer.x - W * .5) / (W * .5), -1, 1);
    const pupilY = clamp((state.pointer.y - H * .45) / (H * .4), -1, 1);

    if (phase < lastBouncePhase - .5) {
      state.shake = Math.max(state.shake, 2.6);
      for (let k = 0; k < 4; k++) {
        particles.push({
          x: cx + rand(-state.mainW * .2, state.mainW * .2),
          y: state.groundY + rand(-4, 8),
          vx: rand(-110, 110),
          vy: rand(-90, -18),
          g: 210,
          r: rand(.8, 2.2),
          life: rand(.35, .8),
          max: .8,
          color: '255,126,58',
          drag: .96
        });
      }
    }
    lastBouncePhase = phase;

    drawMinis(ctx, 'back', dt);

    drawMainShadow(ctx, cx, state.groundY, state.mainW, state.mainH, jump, state.groundY);
    const glow = clamp(.55 + state.musicPulse * .45 + state.excitement * .4, 0, 1.4);
    drawBigAura(ctx, cx, cy, state.mainW, state.mainH, glow);

    if (bigSprite) {
      ctx.save();
      ctx.translate(cx, cy + state.mainH * .5);
      ctx.rotate(rot);
      ctx.scale(sx, sy);
      ctx.translate(0, -state.mainH * .5);
      ctx.drawImage(
        bigSprite.canvas,
        -bigSprite.w * .5, -bigSprite.h * .5,
        bigSprite.w, bigSprite.h
      );
      ctx.restore();

      // a soft, living glow over the carved face
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const faceLight = ctx.createRadialGradient(
        cx, cy - state.mainH * .03, state.mainW * .015,
        cx, cy - state.mainH * .03, state.mainW * .4
      );
      const lightAlpha = (.018 + glow * .045) * flicker;
      faceLight.addColorStop(0, `rgba(255,143,40,${lightAlpha})`);
      faceLight.addColorStop(.55, `rgba(255,101,18,${lightAlpha * .45})`);
      faceLight.addColorStop(1, 'rgba(255,84,10,0)');
      ctx.fillStyle = faceLight;
      ctx.beginPath();
      ctx.ellipse(cx, cy, state.mainW * .34, state.mainH * .3, 0, 0, TAU);
      ctx.fill();
      ctx.restore();

      drawBigPupils(ctx, cx, cy, state.mainW, state.mainH, sx, sy, rot, pupilX, pupilY);
    } else {
      ctx.save();
      drawBigPumpkin(ctx, cx, cy, state.mainW, state.mainH, {
        sx, sy, rot, glow,
        open: state.mouthOpen,
        pupilX, pupilY,
        flicker
      });
      ctx.restore();
    }

    drawMinis(ctx, 'front', dt);
    drawParticles(ctx, dt);
    drawWave(ctx, dt);
    drawNotes(ctx, dt);
    drawEmbers(ctx, dt);
    drawCursor(ctx);
    ctx.restore();

    // flash
    if (state.flash > .001) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const fg = ctx.createRadialGradient(W * .5, H * .48, 20, W * .5, H * .48, Math.max(W, H) * .75);
      fg.addColorStop(0, `rgba(255,133,38,${state.flash * .18})`);
      fg.addColorStop(.55, `rgba(199,62,13,${state.flash * .10})`);
      fg.addColorStop(1, 'rgba(50,5,2,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    requestAnimationFrame(frame);
  }

  /* --- interaction --- */
  function awaken() {
    if (!state.started) {
      state.started = true;
      state.awakeAt = t;
      document.body.classList.add('awake');
      audio.ensure().then(ok => {
        if (!ok) {
          soundText.textContent = '声音不可用';
          return;
        }
        state.audioReady = true;
        audio.setMuted(false);
        soundBtn.classList.add('on');
        soundBtn.classList.remove('muted');
        soundBtn.setAttribute('aria-pressed', 'true');
        soundBtn.setAttribute('aria-label', '关闭声音');
        soundText.textContent = '声音 · 开';
      }).catch(() => {
      soundText.textContent = '声音不可用';
      });
      setTimeout(() => hint.classList.add('dim'), 1200);
    }
  }

  function onPointerDown(e) {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
    const x = e.clientX;
    const y = e.clientY;
    state.pointer.x = x;
    state.pointer.y = y;
    state.pointer.active = true;
    if (e.pointerType === 'touch') {
      state.pointer.touch = true;
      document.body.classList.add('is-touch');
    }
    awaken();
    spawnBurst(x, y, state.clicks === 0);
  }

  function onPointerMove(e) {
    state.pointer.x = e.clientX;
    state.pointer.y = e.clientY;
    state.pointer.active = true;
    if (e.pointerType === 'touch') {
      state.pointer.touch = true;
      document.body.classList.add('is-touch');
    }
  }

  function onPointerLeave() {
    state.pointer.active = false;
  }

  soundBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!state.started) awaken();
    if (!state.audioReady) {
      const ok = await audio.ensure();
      if (!ok) {
      soundText.textContent = '声音不可用';
        return;
      }
      state.audioReady = true;
      audio.setMuted(false);
      soundBtn.classList.add('on');
      soundBtn.classList.remove('muted');
      soundBtn.setAttribute('aria-pressed', 'true');
      soundBtn.setAttribute('aria-label', '关闭声音');
      soundText.textContent = '声音 · 开';
      return;
    }
    const isMuted = !audio.muted;
    audio.setMuted(isMuted);
    state.muted = isMuted;
    soundBtn.classList.toggle('muted', isMuted);
    soundBtn.classList.toggle('on', !isMuted);
    soundBtn.setAttribute('aria-pressed', String(!isMuted));
    soundBtn.setAttribute('aria-label', isMuted ? '开启声音' : '关闭声音');
    soundText.textContent = isMuted ? '声音 · 关' : '声音 · 开';
  });

  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerleave', onPointerLeave, { passive: true });
  window.addEventListener('blur', () => { state.pointer.active = false; });
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 80);
  });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('button')) return;
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!e.repeat) {
        state.pointer.active = false;
        awaken();
        spawnBurst(W * .5, H * .38, state.clicks === 0);
      }
    }
  });
  window.addEventListener('contextmenu', e => e.preventDefault());

  // make sure the canvas and text do not capture touch scroll
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  window.__pumpkin = {
    state, minis, audio,
    burst: (x, y) => spawnBurst(x || W * .5, y || H * .45, state.clicks === 0),
    get stats() { return { minis: minis.length, spawned: state.totalSpawned, clicks: state.clicks, audio: audio.ctx ? audio.ctx.state : 'none' }; }
  };

  /* --- boot --- */
  buildSprites();
  resize();
  requestAnimationFrame((now) => {
    lastFrame = now;
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
